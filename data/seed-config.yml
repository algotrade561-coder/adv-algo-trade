# Initial seed values — loaded ONCE on first startup when each DB table is empty.
# Edit this file to change fresh-DB defaults without touching Java code.
# After seeding, all config is managed via the UI/API and persisted in the database.

globalConfig:
  # Entry
  timeframe: ONE_MINUTE
  trendTimeframe: FIVE_MINUTE
  enabledOptionTypes: "CE,PE"
  enabledUnderlyings: "NIFTY,BANKNIFTY,SENSEX"
  vwapFilterEnabled: true
  trendFilterEnabled: true
  volumeSpikeMultiplier: 1.2
  breakoutBufferPercent: 0.05
  breakoutLookback: 15
  volumeLookback: 5
  bullishImbalanceThreshold: 1.2
  bearishImbalanceThreshold: 0.8
  minLiquidityVolume: 5000
  maxIvPercent: 80
  minSignalScorePercent: 70
  ceOiSupportRequired: false
  peOiSupportRequired: false
  ceOiDivergenceFilterEnabled: true
  peOiDivergenceFilterEnabled: true
  oiDivergenceMultiplier: 2.0
  oiDivergenceMinChange: 100000
  ceBreakoutConfirmationCandles: 1
  peBreakoutConfirmationCandles: 2
  entryStartTime: "09:25"
  entryCutoffTime: "15:10"
  allowFirstMinutesEntry: false
  noEntryFirstMinutes: 10
  rsiFilterEnabled: false
  rsiPeriod: 14
  rsiCeBuyThreshold: 55
  rsiPeSellThreshold: 45
  # Exit
  stopLossPercent: 12
  targetPercent: 24
  trailingStopActivationPercent: 10
  trailingGapPercent: 5
  forcedExitTime: "15:15"
  partialProfitBookingEnabled: false
  maxHoldMinutes: 0
  vwapExitEnabled: false
  globalExitOverride: false
  # Risk
  totalCapital: 80000
  maxRiskPerTradePercent: 20
  maxDailyLossPercent: 60
  maxTradesPerDay: 10
  maxOrdersPerDay: 10
  maxConsecutiveLosses: 2
  maxOpenTrades: 1
  sameInstrumentReentryMinPriceMovePercent: 3
  cooldownMinutes: 0
  dailyProfitTarget: 0
  maxLotsPerTrade: 1
  mlVirtualTradeThreshold: 45
  # Execution tuning
  limitOrderCancelMinutes: 1
  failSafeSquareoffTime: "15:20"
  maxPendingOrders: 3
  ivCollapseExitThresholdPercent: 15
  ivCollapseMaxProfitPercent: 15
  maxEntriesPerScanPerUnderlying: 1

