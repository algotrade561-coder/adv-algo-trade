# ══════════════════════════════════════════════════════════════════════════
# LIVE profile — production deployment (EC2 or remote server)
# ══════════════════════════════════════════════════════════════════════════
# Activate: --spring.profiles.active=live (or SPRING_PROFILES_ACTIVE=live)

# Google OAuth2 authentication — required for live deployment
auth:
  google:
    enabled: true
  cookie:
    # HTTPS-only ALB → SameSite=None + Secure is safe and required for cross-site OAuth callback.
    same-site-none: true

spring:
  h2:
    console:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

logging:
  level:
    com.algo.trade: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

# Ngrok not needed on live — direct public IP or ALB
trading:
  broker:
    ngrok-enabled: false
