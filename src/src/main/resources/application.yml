# ══════════════════════════════════════════════════════════════════════════
# AlgoTrader Pro — Trading Configuration
# ══════════════════════════════════════════════════════════════════════════

trading:
  # ── Mode ────────────────────────────────────────────────────────────────
  mode: LIVE                    # PAPER | BACKTEST | LIVE
  market-data-mode: ZERODHA     # MOCK | ZERODHA
  execution-mode: ZERODHA       # PAPER | ZERODHA
  live-trading-enabled: true    # Must be true for real Zerodha orders
  timezone: Asia/Kolkata

  # ── Broker (Zerodha Kite Connect) ───────────────────────────────────────
  broker:
    name: ZERODHA
    api-key: ${KITE_API_KEY:}
    api-secret: ${KITE_API_SECRET:}
    base-url: https://api.kite.trade
    login-url: https://kite.zerodha.com/connect/login
    # Per-user Kite OAuth callback — stores the token on the logged-in user's DB row.
    # This must match the Redirect URL registered in EACH user's Kite developer app.
    redirect-url: ${KITE_REDIRECT_URL:http://localhost:8089/advalgotrade/me/broker/kite/callback}
    callback-path: /me/broker/kite/callback
    request-timeout: 5s
    # false → no Zerodha login popup at boot; user signs in with Google first,
    # then links Kite via the UI auth page (callback auto-starts WS + scanner).
    # Override with KITE_AUTO_LOGIN=true to restore the old blocking startup login.
    auto-login-on-startup: ${KITE_AUTO_LOGIN:false}
    ngrok-enabled: ${NGROK_ENABLED:false}
    ngrok-path: ${NGROK_PATH:ngrok}
    ngrok-http-port: ${NGROK_HTTP_PORT:8089}
    ngrok-config-path: ${NGROK_CONFIG_PATH:ngrok.yml}
    ngrok-callback-tunnel-name: app
    ngrok-ui-enabled: false
    ngrok-ui-http-port: ${NGROK_UI_HTTP_PORT:8089}
    ngrok-ui-tunnel-name: app

  # ── Symbols ─────────────────────────────────────────────────────────────
  symbols:
    underlyings:
      - NIFTY
      - BANKNIFTY
      - SENSEX
    default-expiry: NEAREST
    spot-quote-keys:
      NIFTY: "NSE:NIFTY 50"
      BANKNIFTY: "NSE:NIFTY BANK"
      SENSEX: "BSE:SENSEX"
      FINNIFTY: "NSE:NIFTY FIN SERVICE"
      MIDCPNIFTY: "NSE:NIFTY MID SELECT"
    spot-historical-keys:
      NIFTY: "NSE:256265"
      BANKNIFTY: "NSE:260105"
      SENSEX: "BSE:265"
      FINNIFTY: "NSE:257801"
      MIDCPNIFTY: "NSE:288009"
  # ── WebSocket Option Subscription ──────────────────────────────────────
  # Underlyings whose option chains are always subscribed for WS tick data,
  # independently of the global scan underlyings (enabledUnderlyings in DB).
  # Ensures OI/PCR data flows for OI_MOMENTUM even if an underlying is not
  # in the active scan set (e.g. SENSEX when paused from the admin UI).
  ws:
    option-underlyings: NIFTY,BANKNIFTY,SENSEX

  # ── Strike Selection ────────────────────────────────────────────────────
  strike:
    selection-mode: ATM          # ATM | ONE_STRIKE_ITM | ONE_STRIKE_OTM
    nearby-strikes: 5

  # ══════════════════════════════════════════════════════════════════════════
  # Entry / Exit / Risk — NOW IN DATABASE
  # ══════════════════════════════════════════════════════════════════════════
  # All entry filters, exit rules, and risk limits are stored in the H2
  # database (global_config table) and editable at runtime via:
  #   - Settings page in the UI
  #   - GET/PUT /advalgotrade/global-config
  #   - POST /advalgotrade/global-config/reset (restores hardcoded defaults)
  #
  # On first startup, defaults are seeded from TradingProperties.defaults().
  # No YAML configuration needed for entry/exit/risk.
  # ══════════════════════════════════════════════════════════════════════════

  # ── Paper Trading ───────────────────────────────────────────────────────
  paper:
    slippage-percent: 0.05
    starting-cash: 30000

  # ── Safety ──────────────────────────────────────────────────────────────
  safety:
    kill-switch-enabled: false
    stale-market-data-threshold: 30s
    broker-retry-count: 2
    broker-retry-backoff: 500ms

  # ── Telegram Alerts ─────────────────────────────────────────────────────
  telegram:
    request-timeout: 5s

  # ── Multi-leg spread execution safety ───────────────────────────────────
  spread:
    margin-preflight-enabled: true
    fill-confirmation-enabled: true
    parallel-buy-legs-enabled: true
    reconciliation-enabled: true
    reconciliation-interval-ms: 120000
    margin-buffer-percent: 3
    leg-fill-timeout: 30s
    parallel-leg-timeout: 10s
    spread-leg-max-retries: 2
    startup-pending-max-age: 30m
    # Exit: ATR | CONFIG | HYBRID (SL wider of config/ATR, target tighter)
    exit-mode-setting: HYBRID
    spread-atr-exits-enabled: true
    exit-backup-enabled: true
    partial-profit-enabled: true
    straddle-adjustment-enabled: true
    straddle-adjustment-trigger-points: 100
    stale-quote-threshold: 5m
    # Broker-side SL-M: places a server-side stop on SELL legs of credit spreads
    # as a catastrophe floor (fires even if JVM is dead). Disabled by default.
    broker-side-sl-enabled: false
    broker-side-sl-multiplier: 2.0

  # ── Single-leg exit behaviour (also see global_config DB overrides) ─────
  # SL/target/forced-exit-time live in DB; only mode knobs need YAML here.
  # Omitting forced-exit-time is OK — TradingProperties.Exit merges with defaults.
  exit:
    exit-mode-setting: HYBRID
    trailing-mode-setting: PRICE
    liquidity:
      enabled: true
      stale-quote-warn-after: 90s
      stale-quote-force-exit-after: 180s
      spread-warn-percent: 5
      spread-exit-percent: 8
      spread-vs-entry-multiplier: 2.0
      volume-collapse-ratio: 0.35
      oi-collapse-ratio: 0.35
      exit-when-bid-ask-missing: true
      missing-bid-ask-ticks-required: 3
      volume-floor-enabled: false
      market-hours-only: true

  # ── Algo Scanner ────────────────────────────────────────────────────────
  # WebSocket is the PRIMARY trigger (CandleClosedEvent).
  # REST poll scheduler is the SAFETY NET — fires only if no candle-driven
  # scan ran within the interval. Prevents missed evaluations on WS hiccups.
  algo:
    scheduler-enabled: true      # REST poll safety net (skips if candle-scan already ran)
    scan-interval-ms: 45000      # 45s — safety net fires if no scan in this window
    initial-delay-ms: 5000
    candle-lookback: 30
    max-entries-per-scan: 1
    refresh-instruments-on-start: true
    auto-start-scanner-after-login: true  # Auto-start scanner + WebSocket after Kite auth

  # ── Multi-user ────────────────────────────────────────────────────────────
  multiuser:
    enabled: true
    signal-copy:
      enabled: true
      # SAFETY: paper-mode entries on the primary do NOT fan out as REAL orders to
      # secondary users unless this is explicitly true. (Bug fixed 2026-06-12: a
      # paper OI_MOMENTUM signal placed a real SENSEX order on the secondary account.)
      copy-paper-signals: false

  # ── Backtest ────────────────────────────────────────────────────────────
  backtest:
    from: 2024-01-01
    to: 2025-01-01
    candle-timeframe: ONE_MINUTE
    csv-import-path: ./data/backtest/imports/input.csv
    output-directory: ./data/backtest/results
    mock-instrument-key: NFO:NIFTY-MOCK-ATM-CE
    mock-candle-count: 180
    lot-size: 65

# ══════════════════════════════════════════════════════════════════════════
# Spring Boot
# ══════════════════════════════════════════════════════════════════════════

spring:
  profiles:
    active: local
  config:
    import: optional:file:./data/trading-secrets.properties
  datasource:
    url: jdbc:h2:file:./data/adv-algo-trade;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.algo.trade: DEBUG

# ── Position Sync ─────────────────────────────────────────────────────────
# manage-synced-trades: false (default) → manual SYNC'd positions are tracked only;
#                                          exit monitors do not auto-close them (manual trading mode).
# manage-synced-trades: true            → manual SYNC'd positions are managed by SL/target/maxHold/squareoff
#                                          (intended for crash-recovery of algo-placed positions).
# Note: this YAML value only seeds the GlobalConfig row on FIRST boot (empty DB).
# After that, the value is sourced from the GlobalConfig DB row and is editable from the Settings UI.
# FailSafeSquareoffDaemon always closes everything at 15:20 regardless of this flag.
position-sync:
  manage-synced-trades: false

# ── Tail Hedge ────────────────────────────────────────────────────────────
tail-hedge:
  enabled: false
  min-position-value: 5000
  otm-strikes: 5
  max-hedge-cost-percent: 10
  price-buffer-percent: 5
  tick-size: 0.05

# ── Regime Filter ─────────────────────────────────────────────────────────
regime-filter:
  enabled: true
  check-interval-seconds: 30

# ── Market Guard ──────────────────────────────────────────────────────────
market-guard:
  vix-max-for-short-premium: 21.0
  vix-min-for-short-premium: 12.0
  vix-min-for-long-premium: 14.0
  circuit-breaker-percent: 2.5
  # Event entries: "yyyy-MM-dd" (date-only) or "yyyy-MM-dd@HH:mm/window-minutes".
  # Date-only entries default to 10:00 IST + 30min post-event window.
  # The post-event window drives EVENT_PASSED exits for LONG_STRADDLE / LONG_STRANGLE.
  event-dates: "2026-06-05@10:00/30,2026-08-05@10:00/30,2026-10-07@10:00/30,2026-12-04@10:00/30"
  event-window-minutes: 0

# ── Algo Flow Orchestrator — pre-trade filter pipeline ────────────────────
algo-flow:
  vix-filter-enabled: true
  session-filter-enabled: true
  event-filter-enabled: true
  volume-activity-enabled: true
  pcr-filter-enabled: true
  oi-price-action-filter-enabled: true   # NEW: confirm breakouts with OI shifts

# ── Expiry Behavior Tuner (operator-style auto-tune, May–Jun 2026) ────────
# Encodes observed daily behaviors: expiry pinning, Sensex reversals, crash halts.
trading.expiry-tuner:
  enabled: true
  sensex-reversal-drop-points: 300       # Min Sensex pts drop before noon to trigger reversal mode
  crash-halt-percent: 1.5               # Min intraday decline % to halt new entries
  momentum-rally-percent: 1.0           # Min intraday rally % to enable directional longs
  pcr-stable-low: 0.7                   # PCR below this = not yet stable (crash halt continues)
  pcr-stable-high: 1.4                  # PCR above this = not yet stable
  reversal-gamma-start: "12:00"         # After this time, allow gamma scalps on Sensex reversal days

# ── Sensex Expiry Reversal Detector ───────────────────────────────────────
# Detects Sensex Thu expiry pattern: weak open → operator buying hourly after noon.
trading.sensex-reversal:
  min-drop-points: 300                   # Sensex must fall ≥300 pts from open before detection
  detection-cutoff: "12:30"             # Only detect the drop pattern before this time
  confirmation-recovery-pct: 50          # Recovery must be ≥50% of drop to confirm reversal

# ── PCR Momentum Reversal Strategy ───────────────────────────────────────
# Detects when PCR drops from a high peak (put writers unwinding = bearish reversal).
# Jun 11 pattern: PCR 1.98 → 1.4, Sensex 74,400 → 73,800.
trading.pcr-reversal:
  enabled: true
  high-pcr-threshold: 1.5               # PCR must reach this to start tracking peak
  min-drop-from-peak: 0.15              # Minimum PCR drop from peak to trigger BUY_PE
  min-peak-readings: 2                   # PCR must stay high for at least N readings (confirms real support)
  min-decline-rate: 0.02                 # Min PCR decline speed (points/min) to confirm active unwinding
  max-signals-per-day: 3                 # Cap PE signals per day from this strategy
  cooldown-minutes: 15                   # Wait between signals

# ── Option-Leads-Index Detector ───────────────────────────────────────────
# Options move before the index. This detector makes option premium breakout
# the PRIMARY signal, with spot index as SECONDARY confirmation.
trading.option-leads:
  enabled: true
  min-premium: 20                        # Avoid < ₹20 options (except expiry scalps)
  abnormal-spike-pct: 10.0              # Premium jump >10% in 60s = event/news anticipated
  confirmation-ticks: 3                  # Debounce: 3 ticks above breakout before confirming
  min-oi-increase-pct: 1.0             # OI must increase ≥1% in 3min (fresh positions, not covering)
  index-lag-threshold-pct: 0.05         # Index hasn't moved >0.05% = option is leading
  breakout-margin-pct: 2.0             # Premium must exceed session high by ≥2%
  index-confirm-window-seconds: 180     # Wait 3min for index to confirm before flagging divergence
  cooldown-seconds: 120                  # 2min cooldown between signals per index
  # Volume spike check: price↑ + OI↑ + volume↑ = strongest conviction
  volume-spike-multiplier: 1.5          # Option volume must be 1.5x opposite side
  # Cross-index confirmation: NIFTY + SENSEX agree → extra confidence
  cross-index-confirm-enabled: true
  cross-index-bonus: 10                  # +10 confidence when both indices align
  # Dynamic premium floor based on IV rank (avoids noise in high-vol regimes)
  iv-rank-high-threshold: 60            # IV rank above this raises premium floor
  high-iv-floor-multiplier: 1.75        # Floor becomes ₹20 × 1.75 = ₹35 when IV high
  # Option reversal exit: detect engulfing/sharp reversal against position
  reversal-exit-enabled: true            # Exit early if option premium drops >5% from breakout

# ── Universal Call Orchestrator ───────────────────────────────────────────
# Centralized signal aggregation layer above all strategies.
# Aggregates signals, resolves conflicts, scales lots, executes immediately.
trading.orchestrator:
  enabled: true
  base-lots: 1                           # Base lot size for single-strategy signal
  max-lot-multiplier: 5                  # Max scaling (even with 20 strategies, cap at 5× base)
  signal-cooldown-seconds: 120           # 2min cooldown for identical signals from same strategy
  aggregation-window-ms: 2000            # 2s window: signals arriving together are aggregated
  min-net-confidence-for-direction: 20   # If |CALL-PUT| < 20 → hedge (straddle both sides)
  max-open-positions: 6                  # Hard cap on simultaneous open positions

# ── Daily Behaviour Recorder ─────────────────────────────────────────────
# Automatically records today's market behaviour at 15:35 IST.
# Appends to daily-behavior-log.yml so the bot self-tunes over time.
trading.behavior-recorder:
  enabled: true
trading.behavior-log:
  path: "./data/daily-behavior-log.yml"

# ── Expiry Operator Trap Detector ────────────────────────────────────────
# Detects post-2PM manipulation: OI divergence traps, gamma blasts, distant
# OI laddering, OI unwind collapses, and expiry pinning toward max pain.
trading.expiry-trap:
  enabled: true
  oi-unwind-threshold-pct: 30            # Alert when OI drops >30% at key strike in one scan
  distant-oi-distance-pct: 2.0           # Track OI buildup >2% away from spot
  distant-oi-min-contracts: 500000       # Min OI to consider "operator laddering"
  pin-bias-start-time: "14:30"           # After this, bias entries toward max pain direction
  squareoff-deadline: "15:20"            # Force exit all positions by this time on expiry

# ── OI Price Action Filter ────────────────────────────────────────────────
oi-price-action:
  enabled: true                          # master switch for OI snapshot capture
  min-oi-change-percent: 1.5               # minimum OI change % to confirm breakout (lowered from 2.5 for intraday)
  max-snapshots: 50                      # how many 5-min snapshots to keep in memory

# ── ATR Indicator ─────────────────────────────────────────────────────────
atr:
  default-period: 14
  sl-atr-multiplier: 2.0
  trail-atr-multiplier: 1.5
  min-sl-percent: 15
  max-sl-percent: 60

# ── Option chain snapshots (feeds Operator Framework + chain files) ───────
snapshot:
  enabled: true
  base-dir: data/chain-snapshots
  retention-days: 60
  strikes-each-side: 10
  underlyings: NIFTY,BANKNIFTY,SENSEX

# ── OI REST Fallback — fills OI ring buffer when WS ticks are sparse ─────
# Kite WS only pushes OI on an instrument when a trade occurs. Quiet ATM
# strikes can go 3–5 min without an OI tick, leaving the ring buffer empty
# and causing CASE5_SKIP in the OI momentum strategy.
# This service detects per-instrument staleness and fires a single batched
# REST /quote call to refresh OI. It stops automatically when WS recovers.
oi-rest-fallback:
  enabled: true
  strikes-each-side: 5          # ATM ± 5 strikes refreshed per index
  underlyings: NIFTY,BANKNIFTY,SENSEX
  ws-stale-ms: 20000            # 20s — trigger REST fallback if no WS tick for this long
  instrument-stale-ms: 180000   # 3 min — per-instrument OI sample staleness threshold
  min-interval-ms: 20000        # minimum gap between consecutive REST batch calls
  # Events: reports/entry-signals/oi-rest-fallback-events.csv (ACTIVATED, BATCH_OK, RESTORED)

# ── OI Momentum Strategy ──────────────────────────────────────────────────
# Java defaults are the single source of truth. Override here for live session tuning.
# Targeting 20+ quality trades/day across NIFTY + BANKNIFTY + SENSEX.
oi-momentum:
  enabled: true
  paper-trading: false

  # ── Entry sensitivity ────────────────────────────────────────────────────
  momentum-threshold-percent: 0.06       # was 0.08 — catch smaller clean moves
  bias-confidence-threshold: 40          # 5pt more room for operator-confirmed entries
  bias-confirmation-ticks: 2             # re-entry boost reduces to 1 automatically

  # ── Throughput ────────────────────────────────────────────────────────────
  soft-target-trades-per-day: 20
  max-trades-per-day: 25
  midday-trade-reduction-percent: 70     # allow more midday entries (12:00–13:00)
  cooldown-after-sl-seconds: 60
  consecutive-loss-pause: 4

# ── Premium Velocity Tracker (Gamma-Regime Detection) ─────────────────────
# Tracks ATM CE/PE premium % change per rolling window. When premium velocity
# vastly exceeds spot velocity (gamma regime), OI Momentum uses premium direction
# as an alternate momentum signal — catching expiry-day moves where spot barely
# moves but options swing 15-20%.
oi-momentum.premium-velocity:
  signal-threshold-pct: 3.0        # min premium % change to consider a signal
  gamma-amplification-min: 5.0     # premium/spot velocity ratio to detect gamma regime
  window-seconds: 60               # rolling window for velocity calculation

# ── Mean Reversion Strategy ───────────────────────────────────────────────
# Midday session only (11:00–13:30). Buys when price stretches from VWAP
# and OI confirms institutions are fading. Complementary to OI Momentum.
strategy:
  mean-reversion:
    deviation-percent: 0.25         # min % deviation from VWAP to trigger
    max-iv-rank: 60                 # don't buy expensive options
    min-confidence: 55              # graduated score threshold
    session-start: "11:00"          # only active during midday chop
    session-end: "13:30"
    min-candles: 10                 # minimum candle history needed

  # ── Exit (backtest-optimised: Trail5/5 + SL12 outperforms Trail8/8 + SL15) ─
  # 47-trade sensitivity sweep on NIFTY: net P&L +₹3,575 vs -₹5,281 baseline.
  # Trail activation at 5% captures profit 3pp sooner; SL at 12% cuts cleaner.
  stop-loss-percent: 12                  # was 15 — tighter cut, no win-rate hit
  trailing-activation-percent: 5        # was 8  — start trailing 3pp sooner
  trailing-gap-percent: 5               # was 8  — tighter trail from peak
  # Break-even stop: once peak ≥ N%, floor SL to 0% (entry price).
  # Modest P&L benefit (+₹145) but strong W/L improvement (0.69→0.90).
  break-even-trigger-percent: 6         # GO-LIVE: profit ratchet active at +6%

  # ── Operator / advanced signals ──────────────────────────────────────────
  operator-bonus-enabled: true
  bid-ask-imbalance-enabled: true
  iv-skew-enabled: true
  oi-velocity-enabled: true
  max-pain-enabled: true
  # Multi-timeframe: backtest shows 5M adds 0 trades (subsumed by 15M cascade).
  # 15M adds 9 trades but all net-negative: WR 57%, AvgW ₹860 vs AvgL ₹1,598 = -₹2,710.
  # 30M alone: WR 68%, net +₹21,660, PF 1.74. Disabling sub-30M windows.
  multi-timeframe-enabled: false         # was true — 5M/15M hurt quality, 30M dominates

  # ── Re-entry boost ────────────────────────────────────────────────────────
  re-entry-boost-enabled: true
  re-entry-boost-window-seconds: 300     # 5-min window for same-direction re-entry after profit

  # ── V3 OPERATOR pipeline (GO-LIVE) ──────────────────────────────────────
  # NOTE: these YAML values are the initial seed. Once OiMomentumRuntimeConfigService
  # has run, any UI-driven change at /advalgotrade/v3-control.html persists to DB
  # and overrides these. To revert to YAML defaults, delete the row from
  # oi_momentum_runtime_config table.
  v3-enabled: true
  v3-shadow-mode: false                    # binding — V3 picks strike + sizes lots
  # Hard safety rails — all on for go-live. Disable via UI if a session goes wrong.
  anti-pyramid-enabled: true               # block same-strike re-entry after a loss
  anti-pyramid-cooldown-minutes: 5
  expiry-otm-cutoff-enabled: true          # block OTM after 14:45 on expiry day
  expiry-otm-cutoff-time: "14:45"
  daily-loss-limit-rupees: 0               # 0 = disabled; absolute rupee floor
  daily-loss-multiplier-of-avg-loser: 3    # halt at -3× avg-loser today
  consecutive-loss-halt-count: 5           # halt after 5 losses in a row

  # ── Legacy enhancements — LIVE (29 May 2026, see OI_MOMENTUM_EMPIRICAL_REPLAY_RESULTS.md)
  # All four flips ON at boot; disable via Settings page if a session goes wrong.
  legacy-time-of-day-mode-enabled: true    # P0-2: filter afternoon/last-hour entries (replay 48%→58% win)
  case0-enabled: true                      # P0-1: OI-led entry (no breakout required)
  case0-shadow-mode: false                 # LIVE: CASE 0 binds entries (not log-only)
  case0-op-score-threshold: 80             # strict (replay 91% 30m win); loose=70
  case0-coil-max-pct: 0.10                 # strict; loose=0.15
  case0-pcr-slope-min-abs: 0.02            # PCR direction-of-tilt requirement
  case4-watchlist-bonus-enabled: true      # P1-3: +5 bias on next OI-aligned signal
  # R3 — Adaptive CASE 0 for low-VIX (29 May 2026 — replay 82% 60m win, ~4/day)
  case0-low-vix-enabled: true
  case0-low-vix-vix-threshold: 17.0
  case0-low-vix-op-score-threshold: 65
  case0-low-vix-coil-max-pct: 0.20
  # R2 — Range-edge fade for range-bound markets (replay 54% 30m win, ~14/day)
  range-edge-fade-enabled: true
  range-edge-fade-range-max-pct: 0.30
  range-edge-fade-edge-pct: 0.20
  range-edge-fade-oi-build-min: 3000
  # Theta-decay gate — reject high-decay entries on both new detectors
  theta-decay-check-enabled: true
  theta-decay-max-cost-pct: 30.0
  # Detection-row CSV — captures every momentum-cycle row for end-of-day analysis.
  legacy-decision-log-enabled: true
  legacy-decision-log-dir: data/oi-decisions

  # P4 instrumentation — ON by default for deploy-and-go data capture (no UI flip needed).
  # Synced from YAML into oi_momentum_runtime_config on every startup.
  record-every-reject: true
  reject-sample-interval-seconds: 30
  matrix-reject-sample-interval-seconds: 5
  summary-reject-top-n: 10
  reject-episode-window-seconds: 60

  # ── V3 recorder + external feeds (only used when v3-enabled: true) ──
  v3:
    decision-log-enabled: true
    decision-log-dir: data/v3-decisions

    # FII/DII data: prefer NSE API, fall back to manual properties file.
    # Set fii-dii-api-enabled: false in firewalled environments.
    fii-dii-api-enabled: true
    fii-dii-api-url: https://www.nseindia.com/api/fiidiiTradeReact
    fii-dii-api-referrer: https://www.nseindia.com/reports/fii-dii
    fii-dii-api-timeout-seconds: 10
    # Manual file used when the API is disabled / down / returns no data.
    # Format (key=value):  fii.net.crore=1234.5  dii.net.crore=-567.8
    fii-dii-file: data/v3-fii-dii.properties

# ── OI Shift Trap — data-week capture + Phase 1-4 enhancements ───────────────
# Master toggle below (enhancements-enabled) gates ALL Phase 1-4 features.
# 2026-06-01: flipped to true after the post-review fix pass — live in production.
# To roll back to legacy behavior in an emergency, set enhancements-enabled: false.
oi-shift-trap:
  # Data-week capture (deploy-and-go, all ON by default)
  capture-enabled: true
  chain-snapshot-warmup-enabled: true
  eval-episode-dedup-enabled: true
  eval-episode-window-seconds: 60
  forward-checkpoints-enabled: true
  confirmation-shadow-enabled: true
  exit-mae-mfe-enabled: true

  # ── Phase 1-4 master toggle (LIVE — flip to false for emergency rollback) ─
  enhancements-enabled: true

  # ── Phase 1 tunables ─────────────────────────────────────────────────────
  trend-lookback-candles: 5
  min-confidence-score: 65
  score-base: 30
  expiry-day-proximity-percent: 1.20
  expiry-day-imbalance-ratio: 1.30
  non-expiry-proximity-percent: 0.75
  non-expiry-imbalance-ratio: 1.50
  imbalance-only-entry-ratio: 2.5

  # ── Phase 2 tunables ─────────────────────────────────────────────────────
  distant-oi-max-strikes: 4
  fake-breakout-volume-multiplier: 2.0
  fake-breakout-reversal-percent: 0.30
  oi-absorption-wall-oi-threshold: 200000
  # Default 1 = single-index-safe (no peer-index agreement required). Raise to 2 only
  # when NIFTY + BANKNIFTY + SENSEX are all actively evaluated in the same 30s window.
  cross-index-min-agreement: 1
  liquidity-hunt-proximity-percent: 0.30

  # ── Phase 3 tunables ─────────────────────────────────────────────────────
  pending-signal-ttl-minutes: 5
  oi-unwind-exit-drop-percent: 10.0
  oi-unwind-exit-window-minutes: 5

  # ── Phase 5 tunables — high-imbalance Telegram watch alerts (no trade required) ─
  # Set imbalance-alert-ratio: 0 to disable the watch alerts entirely.
  imbalance-alert-ratio: 4.0
  imbalance-alert-cooldown-minutes: 5

# ── Signal tuning (EOD HTML from reports/entry-signals CSVs) ───────────────
# Scheduler off by default — heavy on heap (t3.small). CSV capture during live session still runs.
# On-demand: POST /advalgotrade/reports/signal-tuning/generate (or run locally after downloading reports).
signal-tuning:
  scheduler-enabled: false
  block-during-market-hours: true
  load-forward-candles: false

# ── Unified tuning capture (Phase 1) ───────────────────────────────────────
# See important/SIGNAL_CAPTURE_TUNING_REDESIGN.md and SIGNAL_TUNING_IMPLEMENTATION_PLAN.md.
# All per-strategy capture is OFF by default; flip via /settings/tuning-capture UI.
tuning:
  report:
    # Where TuningReportService writes generated HTML. In-process now — no forked JVM,
    # no jar-path, no heap fork-flag.
    output-dir: reports/tuning/html
  capture:
    poll-interval-sec: 30
  # Auto-bootstrap of historical India VIX into the iv_samples table.
  # On startup, HistoricalVixIngestService.autoSeedIfEmpty() checks the row
  # count: if zero, it fetches `years` of India VIX from Yahoo Finance in a
  # background daemon thread. If the table already has rows, it's left alone
  # (re-seeding requires explicit POST /admin/iv-samples/seed-india-vix).
  iv-sample-bootstrap:
    enabled: true
    years: 5
  store:
    # DuckDB native (off-heap) memory cap. NOT JVM heap — DuckDB runs in native C++,
    # so this doesn't pressure the trading JVM's GC. 512MB gives headroom for in-process
    # reports while staying comfortably under EC2 t3.small's 2GB RAM.
    memory-limit: 512MB
    threads: 2
    # DuckDB spill-to-disk directory. Relative to the JVM working dir so it lives
    # under the app tree alongside reports/tuning/html and reports/tuning/archive —
    # matches every other tuning path and avoids needing root-owned /var/tmp.
    temp-directory: reports/tuning/duckdb-tmp
    statement-timeout-sec: 60
  roller:
    # Daily IST-midnight CSV → Parquet rollup + retention enforcement.
    enabled: true
    archive-base-dir: reports/tuning/archive
    summary-base-dir: reports/tuning/summary
    delete-csv-after-roll: true
    # Per-event-type retention in days (design § 12.2).
    retention-days:
      EVALUATION: 90
      SIGNAL: 365
      EXECUTION: 365
      EXIT: 365
      FORWARD_CHECKPOINT: 90
      SHADOW_GATE: 30
  # Interim OOM mitigation: stop writing entry-candles.csv (753 MB / 4.18 M rows).
  # OI Momentum + OI Shift Trap have dedicated forward-return capture; other strategies
  # fire < 30 BUYs/period and their 45m MFE/MAE column will be empty until redesign lands.
  # Flip to true if you need cross-strategy forward MFE/MAE for an investigation.
  # write-candles removed in Phase 6 — no CSV candle writer remains

# ── Trading Calendar (Exchange Holidays) ───────────────────────────────────
# Only include weekday trading holidays here. If a festival falls on Sat/Sun,
# omit it (markets are closed anyway and it does not affect expiry adjustment).
expiry:
  holidays:
    # 2026 (NSE trading holidays — weekdays only)
    - 2026-01-26  # Republic Day
    - 2026-03-03  # Holi
    - 2026-03-26  # Shri Ram Navami
    - 2026-03-31  # Shri Mahavir Jayanti
    - 2026-04-03  # Good Friday
    - 2026-04-14  # Dr. Baba Saheb Ambedkar Jayanti
    - 2026-05-01  # Maharashtra Day
    - 2026-05-28  # Bakri Id (prepones SENSEX weekly expiry)
    - 2026-06-26  # Muharram
    - 2026-09-14  # Ganesh Chaturthi
    - 2026-10-02  # Mahatma Gandhi Jayanti
    - 2026-10-20  # Dussehra
    - 2026-11-10  # Diwali - Balipratipada
    - 2026-11-24  # Prakash Gurpurb Sri Guru Nanak Dev
    - 2026-12-25  # Christmas

server:
  port: 8089
  servlet:
    context-path: /advalgotrade
  forward-headers-strategy: framework

# ── Actuator / Prometheus ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
