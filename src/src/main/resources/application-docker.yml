# ══════════════════════════════════════════════════════════════════════════
# Docker Profile — for containerized deployment
# ══════════════════════════════════════════════════════════════════════════

spring:
  datasource:
    url: jdbc:h2:file:/app/data/algo-trade;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Email (optional — configure if alerts needed)
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8089

logging:
  file:
    name: /app/data/logs/algo-trade.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 14

# Resilience4j for Docker (production settings)
resilience4j:
  circuitbreaker:
    configs:
      # Shared template for the per-account order breakers (brokerOrder-<userId>),
      # created programmatically in ResilientBrokerClient.placeOrder. One user's
      # bad token can only open THEIR breaker, never everyone else's.
      brokerOrder:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15000
        failureRateThreshold: 50
    instances:
      # Legacy global breaker — retained for the brokerApi retry instance below.
      brokerApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15000
        failureRateThreshold: 50
      # Read-side breaker (quotes/positions/orders/instruments). Isolated from order
      # placement so a token-failed positions() poll can no longer poison entries.
      brokerRead:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 15000
        failureRateThreshold: 50
  retry:
    instances:
      brokerApi:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
