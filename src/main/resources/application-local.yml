# ══════════════════════════════════════════════════════════════════════════
# LOCAL profile — development and local trading
# ══════════════════════════════════════════════════════════════════════════
# Activate: --spring.profiles.active=local (or SPRING_PROFILES_ACTIVE=local)

# Google auth enabled — sign in with Google first, then link Kite from the UI
auth:
  google:
    enabled: true

spring:
  h2:
    console:
      enabled: true

logging:
  level:
    com.algo.trade: DEBUG

# ──────────────────────────────────────────────────────────────────────────
# Per-user source-IP automation — DISABLED for local dev.
# No AWS calls, no OS `ip addr` changes; provision/release are track-only no-ops.
# ──────────────────────────────────────────────────────────────────────────
ip-automation:
  enabled: false
  auto-provision-on-create: false
