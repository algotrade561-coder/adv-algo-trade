server:
  port: 8089
  servlet:
    context-path: /advalgotrade
  forward-headers-strategy: framework

# ── Actuator / Prometheus ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
